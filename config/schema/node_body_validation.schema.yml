node_body_validation.settings:
  type: config_object
  label: 'Node body validation settings'
  constraints:
    FullyValidatable: ~
  mapping:
    node_body_validation_config:
      type: mapping
      label: 'Body validation configuration'
      mapping:
        unique:
          type: boolean
          label: 'Unique body across all content types'
        content_types:
          type: sequence
          label: 'Content type rules'
          sequence:
            type: node_body_validation.content_type_rules

node_body_validation.content_type_rules:
  type: mapping
  label: 'Body validation rules'
  mapping:
    exclude:
      type: string
      label: 'Blocked characters, words, or phrases'
    comma:
      type: boolean
      label: 'Block commas'
    min:
      type: integer
      nullable: true
      label: 'Minimum characters'
      constraints:
        Range:
          min: 1
    max:
      type: integer
      nullable: true
      label: 'Maximum characters'
      constraints:
        Range:
          min: 1
    min-wc:
      type: integer
      nullable: true
      label: 'Minimum words'
      constraints:
        Range:
          min: 1
    max-wc:
      type: integer
      nullable: true
      label: 'Maximum words'
      constraints:
        Range:
          min: 1
    unique:
      type: boolean
      label: 'Unique body within this content type'
